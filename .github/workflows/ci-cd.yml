# ================================================================
# CI/CD Pipeline — Controle Financeiro App
# ================================================================
# Stages: lint → unit tests → build → e2e → docker push → deploy
# ================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  NODE_VERSION: 22

jobs:
  # ════════════════════════════════════════════
  # 1. LINT (backend + frontend em paralelo)
  # ════════════════════════════════════════════
  lint:
    name: "Lint (${{ matrix.project }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Generate Prisma Client
        if: matrix.project == 'backend'
        working-directory: backend
        run: npx prisma generate

      - name: ESLint
        working-directory: ${{ matrix.project }}
        run: npm run lint

  # ════════════════════════════════════════════
  # 2. UNIT TESTS (backend + frontend em paralelo)
  # ════════════════════════════════════════════
  unit-tests:
    name: "Unit Tests (${{ matrix.project }})"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        project: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Generate Prisma Client
        if: matrix.project == 'backend'
        working-directory: backend
        run: npx prisma generate

      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: npm test

      - name: Run tests with coverage
        working-directory: ${{ matrix.project }}
        run: npm run test:coverage
        continue-on-error: true

  # ════════════════════════════════════════════
  # 3. BUILD (verifica compilação de ambos)
  # ════════════════════════════════════════════
  build:
    name: "Build (${{ matrix.project }})"
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        project: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: controle_financeiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Generate Prisma Client
        if: matrix.project == 'backend'
        working-directory: backend
        run: npx prisma generate

      - name: Run Prisma Migrations
        if: matrix.project == 'backend'
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/controle_financeiro?schema=public"
        run: npx prisma migrate deploy

      - name: Build
        working-directory: ${{ matrix.project }}
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/controle_financeiro?schema=public"
          JWT_SECRET: ci-build-secret-key-minimum-8
          USE_MOCK_MODE: "true"
        run: npm run build

  # ════════════════════════════════════════════
  # 4. E2E TESTS (Playwright)
  # ════════════════════════════════════════════
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Start backend (mock mode)
        working-directory: backend
        env:
          USE_MOCK_MODE: "true"
          JWT_SECRET: e2e-ci-secret-key-minimum-8
          DATABASE_URL: "postgresql://localhost/unused"
          NODE_ENV: test
          PORT: 3333
          HOST: 0.0.0.0
        run: npx tsx src/main.ts &

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:3333"
        run: npm start &

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:3333/health && break
            sleep 1
          done

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:3000 && break
            sleep 1
          done

      - name: Run Playwright tests
        working-directory: e2e
        env:
          CI: "true"
          E2E_BASE_URL: "http://localhost:3000"
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  # ════════════════════════════════════════════
  # 5. DOCKER BUILD & PUSH
  # ════════════════════════════════════════════
  docker:
    name: "Docker (${{ matrix.project }})"
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - project: backend
            context: ./backend
          - project: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.project }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════
