# ================================================================
# CI/CD Pipeline — Controle Financeiro App
# ================================================================
# Triggers: push/PR para main e develop
# Jobs: lint → build & test → docker build/push → deploy (opcional)
# ================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Altere para o seu Docker Hub user ou use ghcr.io (GitHub Container Registry)
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ────────────────────────────────────────────
  # 1. LINT
  # ────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Generate Prisma Client (backend only)
        if: matrix.project == 'backend'
        working-directory: backend
        run: npx prisma generate

      - name: Run ESLint
        working-directory: ${{ matrix.project }}
        run: npm run lint

  # ────────────────────────────────────────────
  # 2. BUILD & TEST
  # ────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        project: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: controle_financeiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Generate Prisma Client (backend only)
        if: matrix.project == 'backend'
        working-directory: backend
        run: npx prisma generate

      - name: Run Prisma Migrations (backend only)
        if: matrix.project == 'backend'
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/controle_financeiro?schema=public"
        run: npx prisma migrate deploy

      - name: Build
        working-directory: ${{ matrix.project }}
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/controle_financeiro?schema=public"
          JWT_SECRET: ci-test-secret-key-minimum-8
          USE_MOCK_MODE: "true"
        run: npm run build

  # ────────────────────────────────────────────
  # 3. DOCKER BUILD & PUSH
  # ────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - project: backend
            context: ./backend
            image_env: BACKEND_IMAGE
          - project: frontend
            context: ./frontend
            image_env: FRONTEND_IMAGE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.project }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────
  # 4. DEPLOY (opcional — Railway / Render / VPS)
