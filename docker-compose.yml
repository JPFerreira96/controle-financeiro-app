services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: controle_financeiro_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: controle_financeiro
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend (Fastify API) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: controle_financeiro_backend
    restart: unless-stopped
    ports:
      - "3333:3333"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/controle_financeiro?schema=public"
      USE_MOCK_MODE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node dist/main.js"
    develop:
      watch:
        - action: rebuild
          path: ./backend/src
        - action: rebuild
          path: ./backend/prisma

  # ── Frontend (Next.js) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3333"
    container_name: controle_financeiro_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ./frontend/src
        - action: rebuild
          path: ./frontend/public

volumes:
  pg_data:

